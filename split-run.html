/* ---------------------------------------------------------------------- */

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function toKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function fromKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }
function fmtShort(d) { return `${MONTH_NAMES[d.getMonth()].slice(0, 3)} ${d.getDate()}`; }
function fmtLong(d) { return `${DOW_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`; }

/* ---------------------------------------------------------------------- */
/*  Program index / schedule logic                                         */
/* ---------------------------------------------------------------------- */

function computeProgramIndex(dateObj, startDateObj, statusMap) {
  const days = daysBetween(startDateObj, dateObj);
  if (days < 0) return null;
  let skipsBefore = 0;
  const dStart = startOfDay(dateObj);
  for (const key in statusMap) {
    if (statusMap[key] !== "skipped") continue;
    const kd = fromKey(key);
    if (kd >= startDateObj && kd < dStart) skipsBefore++;
  }
  return days - skipsBefore;
}
function getDayPlan(dateObj, startDateObj, statusMap) {
  const key = toKey(dateObj);
  const status = statusMap[key] || "pending";
  const programIndex = computeProgramIndex(dateObj, startDateObj, statusMap);
  if (programIndex === null) return { key, status: "before-start", programIndex: null };
  const cyclePos = ((programIndex % 14) + 14) % 14;
  const week = weekNumberFor(programIndex);
  const slot = CYCLE[cyclePos];
  const weekLetter = cyclePos < 7 ? "A" : "B";
  return { key, status, programIndex, cyclePos, week, weekLetter, slot };
}

/* ---------------------------------------------------------------------- */
/*  Progressive overload + timer helpers                                   */
/* ---------------------------------------------------------------------- */

function parseRepRange(repsStr) {
  if (!repsStr) return null;
  const parts = repsStr.split(/[–-]/).map((s) => parseInt(s.trim(), 10)).filter((n) => !isNaN(n));
  if (parts.length === 0) return null;
  if (parts.length === 1) return { min: parts[0], max: parts[0] };
  return { min: parts[0], max: parts[1] };
}

function getProgressionSuggestion(exerciseName, repsStr, liftLogs, excludeDateKey) {
  const range = parseRepRange(repsStr);
  const history = liftLogs.filter((l) => l.exercise === exerciseName && l.date !== excludeDateKey);
  if (history.length === 0) return { text: "No history yet — log today's weight to start tracking." };
  let lastDate = history[0].date;
  history.forEach((l) => { if (l.date > lastDate) lastDate = l.date; });
  const lastSets = history.filter((l) => l.date === lastDate);
  let topSet = lastSets[0];
  lastSets.forEach((l) => { if (Number(l.weight) > Number(topSet.weight)) topSet = l; });
  const repsAtTop = Number(topSet.reps) || 0;
  if (range && repsAtTop >= range.max && Number(topSet.weight) > 0) {
    const suggestedWeight = Math.round(Number(topSet.weight) * 1.0375 * 2) / 2;
    return { text: `Last time: ${topSet.weight} × ${topSet.reps}. Hit the top of the range — try ~${suggestedWeight}.`, suggestedWeight };
  }
  if (range) {
    const nextReps = Math.min(repsAtTop + 1, range.max) || range.min;
    return { text: `Last time: ${topSet.weight} × ${topSet.reps}. Same weight, aim for ${nextReps}+ reps.`, suggestedWeight: Number(topSet.weight) };
  }
  return { text: `Last time: ${topSet.weight} × ${topSet.reps}.`, suggestedWeight: Number(topSet.weight) };
}

function getElapsedMs(session) {
  if (!session) return 0;
  return session.accumulatedMs + (session.isRunning && session.startedAt ? (Date.now() - session.startedAt) : 0);
}
function formatElapsed(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const hh = Math.floor(totalSec / 3600);
  const mm = Math.floor((totalSec % 3600) / 60);
  const ss = totalSec % 60;
  return (hh > 0 ? pad2(hh) + ":" : "") + pad2(mm) + ":" + pad2(ss);
}

/* ---------------------------------------------------------------------- */
/*  Minimal inline line chart                                              */
/* ---------------------------------------------------------------------- */

function MiniLineChart({ data, color, valueKey }) {
  if (!data || data.length === 0) return null;
  const w = 320, chH = 140, pad = 24;
  const values = data.map((d) => d[valueKey]);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = data.map((d, i) => {
    const x = pad + i * stepX;
    const y = pad + (chH - pad * 2) * (1 - (d[valueKey] - min) / range);
    return { x, y, label: d.date, value: d[valueKey] };
  });
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const gridLines = [0.25, 0.5, 0.75].map((f) => {
    const yy = pad + (chH - pad * 2) * f;
    return h("line", { key: f, x1: pad, x2: w - pad, y1: yy, y2: yy, stroke: C.hairline, strokeDasharray: "3 3" });
  });
  const circles = points.map((p, i) => h("circle", { key: i, cx: p.x, cy: p.y, r: 3, fill: color }, h("title", null, `${p.label}: ${p.value}`)));
  const labels = points.length > 0 ? [
    h("text", { key: "a", x: points[0].x, y: chH - 4, fontSize: 9, fill: C.textFaint, textAnchor: "start" }, points[0].label),
    h("text", { key: "b", x: points[points.length - 1].x, y: chH - 4, fontSize: 9, fill: C.textFaint, textAnchor: "end" }, points[points.length - 1].label),
  ] : [];
  return h("svg", { viewBox: `0 0 ${w} ${chH}`, style: { width: "100%", height: "100%" } }, gridLines, h("path", { d: path, fill: "none", stroke: color, strokeWidth: "2" }), circles, labels);
}

function DayDetail({ dateObj, plan, onSetStatus, onClose, activeSession, onStartWorkout }) {
  if (!plan || plan.status === "before-start") {

        h("h3", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 18, margin: 0 } }, fmtLong(dateObj)),
        onClose ? h("button", { onClick: onClose, style: { background: "none", border: "none", padding: 4, color: C.textMuted } }, h(Icon, { name: "x", size: 16 })) : null
      ),
      h("p", { style: { color: C.textMuted, fontSize: 14 } }, "This date is before the program's start.")
    );

    ),
    h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginTop: 12, marginBottom: 16 } },
      h(AccentDot, { color: accent, size: 9 }),
      h("span", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 16 } }, slotTitle(slot)),
      status === "done" ? h(Pill, { color: C.brass }, "Completed") : null,

    slot.isRest
      ? h("p", { style: { color: C.textMuted, fontSize: 14, lineHeight: 1.6 } }, "Actually rest. Walking and light mobility are fine — this is what makes the next quality session possible.")
      : h(React.Fragment, null,
          !otherSessionActive ? h("button", { onClick: () => onStartWorkout(key), style: { width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "12px 0", marginBottom: 16, background: isThisSessionActive ? C.surfaceRaised : C.teal, color: isThisSessionActive ? C.text : "#08211F", border: isThisSessionActive ? `1px solid ${C.teal}` : "none", borderRadius: 8, fontSize: 14, fontWeight: 600 } },
              h(Icon, { name: isThisSessionActive ? "clock" : "play", size: 16 }),

            ) : h("div", { style: { color: C.textFaint, fontSize: 12.5, marginBottom: 16 } }, "Finish your current workout to start this one."),

            h("div", { style: { display: "flex", flexDirection: "column" } }, calisthenicsRows)
          ) : null,
          cond ? h("div", { style: { marginBottom: 8 } },
            h("div", { style: { color: C.textFaint, fontSize: 11, letterSpacing: 0.4, marginBottom: 6 } }, "CONDITIONING"),
            h("div", { style: { display: "flex", alignItems: "flex-start", gap: 8 } },

    ) : null
  );
}

function CalendarTab({ startDate, statusMap, onSetStatus, activeSession, onStartWorkout }) {
  const today = startOfDay(new Date());
  const [viewMonth, setViewMonth] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [selected, setSelected] = useState(today);

  const cells = useMemo(() => {
    const first = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
    const startOffset = first.getDay();
    const gridStart = addDays(first, -startOffset);
    return Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
  }, [viewMonth]);

  const selectedPlan = getDayPlan(selected, startDate, statusMap);

  const dowHeaders = DOW_NAMES.map((d) => h("div", { key: d, style: { textAlign: "center", padding: "4px 0", color: C.textFaint, fontSize: 11 } }, d));

  const dayCells = cells.map((d, i) => {
    const inMonth = d.getMonth() === viewMonth.getMonth();
    const plan = getDayPlan(d, startDate, statusMap);
    const accent = plan.status === "before-start" ? null : slotAccent(plan.slot);
    const isToday = daysBetween(today, d) === 0;
    const isSelected = daysBetween(selected, d) === 0;
    let marker = null;
    if (accent) {
      if (plan.status === "skipped") marker = h(Icon, { name: "x", size: 9, color: C.rust });
      else if (plan.status === "done") marker = h(Icon, { name: "check", size: 9, color: C.brass });
      else marker = h(AccentDot, { color: accent, size: 5 });
    }
    return h("button", { key: i, onClick: () => setSelected(d), style: {
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4,
        padding: "8px 0", background: isSelected ? C.surfaceRaised : "transparent",
        border: isToday ? `1px solid ${C.brass}` : "1px solid transparent", borderRadius: 7,
        opacity: inMonth ? 1 : 0.28,
      } },
      h("span", { style: { color: C.text, fontSize: 12.5, fontFamily: FONT_MONO } }, d.getDate()),
      marker
    );
  });

  return h("div", { style: { display: "flex", flexDirection: "column", gap: 16 } },
    h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
      h("h2", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 20, margin: 0 } }, `${MONTH_NAMES[viewMonth.getMonth()]} ${viewMonth.getFullYear()}`),
      h("div", { style: { display: "flex", gap: 4 } },
        h("button", { onClick: () => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1)), style: { background: "none", padding: 6, color: C.textMuted, border: `1px solid ${C.hairline}`, borderRadius: 6 } }, h(Icon, { name: "chevronLeft", size: 16 })),
        h("button", { onClick: () => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1)), style: { background: "none", padding: 6, color: C.textMuted, border: `1px solid ${C.hairline}`, borderRadius: 6 } }, h(Icon, { name: "chevronRight", size: 16 }))
      )
    ),
    h("div", { style: { display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 } }, dowHeaders, dayCells),
    h("div", { style: { display: "flex", alignItems: "center", gap: 16, padding: "0 4px" } },
      h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h(AccentDot, { color: C.brass }), h("span", { style: { color: C.textMuted, fontSize: 11.5 } }, "Upper")),
      h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h(AccentDot, { color: C.teal }), h("span", { style: { color: C.textMuted, fontSize: 11.5 } }, "Lower")),
      h("div", { style: { display: "flex", alignItems: "center", gap: 6 } }, h(AccentDot, { color: C.textFaint }), h("span", { style: { color: C.textMuted, fontSize: 11.5 } }, "Rest"))
    ),
    h(DayDetail, { dateObj: selected, plan: selectedPlan, onSetStatus, activeSession, onStartWorkout })
  );
}

function ThisWeekTab({ startDate, statusMap, onSetStatus, activeSession, onStartWorkout }) {
  const today = startOfDay(new Date());
  const days = Array.from({ length: 7 }, (_, i) => addDays(today, i));
  const [openKey, setOpenKey] = useState(toKey(today));

  const rows = days.map((d) => {
    const plan = getDayPlan(d, startDate, statusMap);
    const key = toKey(d);
    const isOpen = openKey === key;
    const isToday = daysBetween(today, d) === 0;
    const accent = plan.status === "before-start" ? C.textFaint : slotAccent(plan.slot);
    return h("div", { key, style: { borderBottom: `1px solid ${C.hairline}` } },
      h("button", { onClick: () => setOpenKey(isOpen ? null : key), style: { width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 0", background: "none", border: "none" } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 12 } },
          h(AccentDot, { color: accent, size: 8 }),
          h("div", { style: { textAlign: "left" } },
            h("div", { style: { color: C.text, fontSize: 14, fontWeight: isToday ? 600 : 400 } }, `${fmtShort(d)}${isToday ? " · Today" : ""}`),
            h("div", { style: { color: C.textMuted, fontSize: 12.5, marginTop: 1 } }, plan.status === "before-start" ? "Not started yet" : slotTitle(plan.slot))
          )
        ),
        h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
          plan.status === "done" ? h(Pill, { color: C.brass }, "Done") : null,
          plan.status === "skipped" ? h(Pill, { color: C.rust }, "Skipped") : null,
          activeSession && activeSession.dateKey === key ? h(Pill, { color: C.teal }, "In progress") : null,
          h("span", { style: { transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s", display: "flex" } }, h(Icon, { name: "chevronRight", size: 15, color: C.textFaint }))
        )
      ),
      isOpen ? h("div", { style: { paddingBottom: 16 } }, h(DayDetail, { dateObj: d, plan, onSetStatus, activeSession, onStartWorkout })) : null
    );
  });

  return h("div", { style: { display: "flex", flexDirection: "column", gap: 2 } },
    h("h2", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 20, marginBottom: 4 } }, "Next 7 days"),
    rows
  );
}

function WorkoutSessionView({ dateObj, plan, session, liftLogs, onAddSet, onRemoveSet, onTogglePause, onEnd, onMinimize }) {
  const [, setTick] = useState(0);
  useEffect(() => {
    if (!session.isRunning) return;
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [session.isRunning, session.startedAt]);

  const elapsedMs = getElapsedMs(session);
  const slot = plan.slot;
  const exercises = slot.isRest ? [] : STRENGTH[slot.strength].exercises.concat(slot.calisthenics ? CALISTHENICS : []);

  const cards = exercises.map((ex, i) => {
    const loggedForEx = session.loggedSets.filter((s) => s.exercise === ex.name);
    const suggestion = getProgressionSuggestion(ex.name, ex.reps, liftLogs, session.dateKey);
    return h(ExerciseSessionCard, { key: ex.name + i, exercise: ex, loggedSets: loggedForEx, suggestion, onAddSet: (w, r) => onAddSet(ex.name, w, r), onRemoveSet });
  });

  return h("div", { style: { background: C.bg, minHeight: "100vh", fontFamily: FONT_BODY, display: "flex", flexDirection: "column" } },
    h("div", { style: { padding: "16px 20px", borderBottom: `1px solid ${C.hairline}`, display: "flex", flexDirection: "column", gap: 10 } },
      h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
        h("button", { onClick: onMinimize, style: { background: "none", border: "none", color: C.textMuted, padding: 4, display: "flex", alignItems: "center", gap: 4, fontSize: 13 } }, h(Icon, { name: "chevronLeft", size: 16 }), " Minimize"),
        h("div", { style: { color: C.textMuted, fontSize: 12.5 } }, fmtLong(dateObj))
      ),
      h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
          h(Icon, { name: "clock", size: 18, color: C.brass }),
          h("span", { style: { fontFamily: FONT_MONO, fontSize: 26, color: C.text } }, formatElapsed(elapsedMs))
        ),
        h("div", { style: { display: "flex", gap: 8 } },
          h("button", { onClick: onTogglePause, style: { display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: C.surfaceRaised, color: C.text, border: `1px solid ${C.hairline}`, borderRadius: 7, fontSize: 13 } }, h(Icon, { name: session.isRunning ? "pause" : "play", size: 14 }), session.isRunning ? " Pause" : " Resume"),
          h("button", { onClick: onEnd, style: { display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: C.brass, color: "#1B1204", border: "none", borderRadius: 7, fontSize: 13, fontWeight: 600 } }, h(Icon, { name: "stop", size: 14 }), " End")
        )
      ),
      h("div", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 16 } }, slotTitle(slot))
    ),
    h("div", { style: { flex: 1, overflowY: "auto", padding: "16px 20px", display: "flex", flexDirection: "column", gap: 12 } },
      cards,
      slot.conditioning ? h("div", { style: { padding: 14, background: C.surfaceRaised, borderRadius: 10, border: `1px solid ${C.hairline}`, color: C.textMuted, fontSize: 12.5 } }, `Don't forget conditioning: ${CONDITIONING[slot.conditioning].label} — ${CONDITIONING[slot.conditioning].detail(plan.week)}`) : null
    )
  );
}

function OneRepMaxCalc() {
  const [weight, setWeight] = useState("");
  const [reps, setReps] = useState("");
  const w = parseFloat(weight);
  const r = parseInt(reps, 10);
  const valid = w > 0 && r > 0 && r <= 15;
  const oneRM = valid ? w * (1 + r / 30) : null;
  const rows = valid ? Array.from({ length: 10 }, (_, i) => i + 1).map((rr) => ({ reps: rr, weight: Math.round((oneRM / (1 + rr / 30)) * 2) / 2 })) : [];

  return h("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
    h("div", { style: { display: "flex", flexDirection: "column", gap: 8, padding: 16, background: C.surfaceRaised, borderRadius: 10, border: `1px solid ${C.hairline}` } },
      h("div", { style: { color: C.textFaint, fontSize: 11, letterSpacing: 0.4 } }, "ENTER A RECENT (OR BELIEVED) LIFT"),
      h("div", { style: { display: "flex", gap: 8 } },
        h("input", { placeholder: "Weight", inputMode: "decimal", value: weight, onChange: (e) => setWeight(e.target.value), style: inputStyle() }),
        h("input", { placeholder: "Reps", inputMode: "numeric", value: reps, onChange: (e) => setReps(e.target.value), style: inputStyle() })
      )
    ),
    valid ? h("div", { style: { padding: 16, background: C.surfaceRaised, borderRadius: 10, border: `1px solid ${C.hairline}` } },
      h("div", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 18 } }, `Estimated 1RM: ${Math.round(oneRM * 2) / 2}`),
      h("div", { style: { color: C.textFaint, fontSize: 11, marginTop: 2 } }, "Epley formula estimate"),
      h("div", { style: { display: "flex", flexDirection: "column", marginTop: 10 } }, rows.map((row) =>
        h("div", { key: row.reps, style: { display: "flex", justifyContent: "space-between", padding: "6px 0", borderTop: `1px solid ${C.hairline}` } },
          h("span", { style: { color: C.textMuted, fontSize: 13 } }, `${row.reps} rep${row.reps > 1 ? "s" : ""}`),
          h("span", { style: { color: C.text, fontSize: 13, fontFamily: FONT_MONO } }, row.weight)
        )
      ))
    ) : h("div", { style: { color: C.textFaint, fontSize: 12.5, padding: "0 4px" } }, "Enter a weight and rep count to see estimates.")
  );
}

/* ---------------------------------------------------------------------- */
/*  Progress tab                                                           */
/* ---------------------------------------------------------------------- */

function ProgressTab({ liftLogs, runLogs, bodyWeightLogs, onAddLift, onAddRun, onAddBodyWeight }) {
  const [mode, setMode] = useState("lift");
  const [liftExercise, setLiftExercise] = useState(ALL_EXERCISE_NAMES[0]);
  const [runType, setRunType] = useState("vo2");

  const liftChartData = useMemo(() => liftLogs.filter((l) => l.exercise === liftExercise).sort((a, b) => a.date.localeCompare(b.date)).map((l) => ({ date: fmtShort(fromKey(l.date)), weight: l.weight })), [liftLogs, liftExercise]);
  const runChartData = useMemo(() => runLogs.filter((r) => r.type === runType).sort((a, b) => a.date.localeCompare(b.date)).map((r) => ({ date: fmtShort(fromKey(r.date)), duration: r.duration })), [runLogs, runType]);
  const bodyChartData = useMemo(() => bodyWeightLogs.slice().sort((a, b) => a.date.localeCompare(b.date)).map((b) => ({ date: fmtShort(fromKey(b.date)), weight: b.weight })), [bodyWeightLogs]);

  const tabBtn = (key, label, iconName) => h("button", { key, onClick: () => setMode(key), style: {
      flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, padding: "8px 0",
      background: "none", border: "none", borderBottom: `2px solid ${mode === key ? C.brass : "transparent"}`,
      color: mode === key ? C.text : C.textMuted, fontSize: 11,
    } }, h(Icon, { name: iconName, size: 15 }), label);

  const selectStyle = { background: C.surface, color: C.text, border: `1px solid ${C.hairline}`, borderRadius: 6, padding: "6px 8px", fontSize: 13 };
  const liftExOptions = ALL_EXERCISE_NAMES.map((n) => h("option", { key: n, value: n }, n));

  const liftRecentRows = liftLogs.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12).map((l) =>
    h("div", { key: l.id, style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderTop: `1px solid ${C.hairline}` } },
      h("div", null, h("div", { style: { color: C.text, fontSize: 13 } }, l.exercise), h("div", { style: { color: C.textFaint, fontSize: 11.5 } }, fmtShort(fromKey(l.date)))),
      h("div", { style: { color: C.textMuted, fontSize: 13, fontFamily: FONT_MONO } }, `${l.weight}${l.reps ? ` × ${l.reps}` : ""}${l.sets ? ` × ${l.sets}` : ""}`)
    )
  );

  const runRecentRows = runLogs.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12).map((r) => {
    const condInfo = CONDITIONING[r.type];
    return h("div", { key: r.id, style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderTop: `1px solid ${C.hairline}` } },
      h("div", null, h("div", { style: { color: C.text, fontSize: 13 } }, condInfo ? condInfo.label : "Other"), h("div", { style: { color: C.textFaint, fontSize: 11.5 } }, `${fmtShort(fromKey(r.date))}${r.notes ? ` · ${r.notes}` : ""}`)),
      h("div", { style: { color: C.textMuted, fontSize: 13, fontFamily: FONT_MONO } }, `${r.duration}min${r.rpe ? ` · RPE ${r.rpe}` : ""}`)
    );
  });

  const bodyRecentRows = bodyWeightLogs.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12).map((b) =>
    h("div", { key: b.id, style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderTop: `1px solid ${C.hairline}` } },
      h("div", { style: { color: C.text, fontSize: 13 } }, fmtShort(fromKey(b.date))),
      h("div", { style: { color: C.textMuted, fontSize: 13, fontFamily: FONT_MONO } }, b.weight)
    )
  );

  const liftSection = h(React.Fragment, null,
    h(LiftForm, { onAdd: onAddLift }),
    h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
      h("span", { style: { color: C.textFaint, fontSize: 11, letterSpacing: 0.4 } }, "TREND"),
      h("select", { value: liftExercise, onChange: (e) => setLiftExercise(e.target.value), style: selectStyle }, liftExOptions)
    ),
    h("div", { style: { height: 160, background: C.surfaceRaised, borderRadius: 10, border: `1px solid ${C.hairline}`, padding: 12 } },
      liftChartData.length > 0 ? h(MiniLineChart, { data: liftChartData, color: C.brass, valueKey: "weight" }) : h("div", { style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: C.textFaint, fontSize: 12.5 } }, "No sets logged for this exercise yet")
    ),
    h("div", { style: { display: "flex", flexDirection: "column" } }, liftRecentRows)
  );

  const runSection = h(React.Fragment, null,
    h(RunForm, { onAdd: onAddRun }),
    h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
      h("span", { style: { color: C.textFaint, fontSize: 11, letterSpacing: 0.4 } }, "TREND"),
      h("select", { value: runType, onChange: (e) => setRunType(e.target.value), style: selectStyle },
        h("option", { value: "vo2" }, "VO2max intervals"),
        h("option", { value: "threshold" }, "Lactate threshold"),
        h("option", { value: "zone2" }, "Zone 2"),
        h("option", { value: "other" }, "Other")
      )
    ),
    h("div", { style: { height: 160, background: C.surfaceRaised, borderRadius: 10, border: `1px solid ${C.hairline}`, padding: 12 } },
      runChartData.length > 0 ? h(MiniLineChart, { data: runChartData, color: C.teal, valueKey: "duration" }) : h("div", { style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: C.textFaint, fontSize: 12.5 } }, "No sessions logged for this type yet")
    ),
    h("div", { style: { display: "flex", flexDirection: "column" } }, runRecentRows)
  );

  const bodySection = h(React.Fragment, null,
    h(BodyWeightForm, { onAdd: onAddBodyWeight }),
    h("div", { style: { color: C.textFaint, fontSize: 11, letterSpacing: 0.4 } }, "TREND"),
    h("div", { style: { height: 160, background: C.surfaceRaised, borderRadius: 10, border: `1px solid ${C.hairline}`, padding: 12 } },
      bodyChartData.length > 0 ? h(MiniLineChart, { data: bodyChartData, color: C.brass, valueKey: "weight" }) : h("div", { style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: C.textFaint, fontSize: 12.5 } }, "No body weight logged yet")
    ),
    h("div", { style: { display: "flex", flexDirection: "column" } }, bodyRecentRows)
  );

  let activeSection = liftSection;
  if (mode === "run") activeSection = runSection;
  else if (mode === "body") activeSection = bodySection;
  else if (mode === "orm") activeSection = h(OneRepMaxCalc);

  return h("div", { style: { display: "flex", flexDirection: "column", gap: 16 } },
    h("h2", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 20, margin: 0 } }, "Progress"),
    h("div", { style: { display: "flex", borderBottom: `1px solid ${C.hairline}` } },
      tabBtn("lift", "Lift", "dumbbell"), tabBtn("run", "Cardio", "activity"), tabBtn("body", "Body", "scale"), tabBtn("orm", "1RM", "calc")
    ),
    activeSection
  );
}

/* ---------------------------------------------------------------------- */
/*  Root app                                                               */
/* ---------------------------------------------------------------------- */

function FitnessApp() {
  const [tab, setTab] = useState("week");
  const [startDate, setStartDate] = useState(() => {
    const meta = lsGet("program-meta", null);
    return meta && meta.startDate ? startOfDay(fromKey(meta.startDate)) : startOfDay(new Date());
  });
  const [statusMap, setStatusMap] = useState(() => lsGet("day-status", {}));
  const [liftLogs, setLiftLogs] = useState(() => lsGet("lift-logs", []));
  const [runLogs, setRunLogs] = useState(() => lsGet("run-logs", []));
  const [bodyWeightLogs, setBodyWeightLogs] = useState(() => lsGet("body-weight-logs", []));
  const [activeSession, setActiveSession] = useState(() => lsGet("active-session", null));
  const [sessionViewOpen, setSessionViewOpen] = useState(false);
  const [editingStart, setEditingStart] = useState(false);
  const [, setTick] = useState(0);

  useEffect(() => {
    if (!activeSession || !activeSession.isRunning) return;
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [activeSession && activeSession.isRunning, activeSession && activeSession.startedAt]);

  const persistSession = useCallback((updater) => {
    setActiveSession((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      lsSet("active-session", next);
      return next;
    });
  }, []);

  const handleSetStatus = useCallback((dateKey, status) => {
    setStatusMap((prev) => {
      const next = { ...prev };
      if (status === "pending") delete next[dateKey]; else next[dateKey] = status;
      lsSet("day-status", next);
      return next;
    });
  }, []);

  const persistStartDate = useCallback((d) => {
    const sd = startOfDay(d);
    setStartDate(sd);
    lsSet("program-meta", { startDate: toKey(sd) });
  }, []);

  const handleAddLift = useCallback((entry) => {
    setLiftLogs((prev) => { const next = [...prev, entry]; lsSet("lift-logs", next); return next; });
  }, []);
  const handleAddRun = useCallback((entry) => {
    setRunLogs((prev) => { const next = [...prev, entry]; lsSet("run-logs", next); return next; });
  }, []);
  const handleAddBodyWeight = useCallback((entry) => {
    setBodyWeightLogs((prev) => { const next = [...prev, entry]; lsSet("body-weight-logs", next); return next; });
  }, []);

  const handleStartWorkout = useCallback((dateKey) => {
    setActiveSession((prev) => {
      if (prev && prev.dateKey === dateKey) { setSessionViewOpen(true); return prev; }
      if (prev && prev.dateKey !== dateKey) return prev;
      const fresh = { dateKey, startedAt: Date.now(), accumulatedMs: 0, isRunning: true, loggedSets: [] };
      lsSet("active-session", fresh);
      setSessionViewOpen(true);
      return fresh;
    });
  }, []);

  const handleAddSet = useCallback((exerciseName, weight, reps) => {
    persistSession((prev) => prev ? { ...prev, loggedSets: [...prev.loggedSets, { id: Date.now() + Math.random(), exercise: exerciseName, weight: Number(weight) || 0, reps: Number(reps) || 0 }] } : prev);
  }, [persistSession]);

  const handleRemoveSet = useCallback((id) => {
    persistSession((prev) => prev ? { ...prev, loggedSets: prev.loggedSets.filter((s) => s.id !== id) } : prev);
  }, [persistSession]);

  const handleTogglePause = useCallback(() => {
    persistSession((prev) => {
      if (!prev) return prev;
      if (prev.isRunning) return { ...prev, isRunning: false, accumulatedMs: prev.accumulatedMs + (Date.now() - prev.startedAt), startedAt: null };
      return { ...prev, isRunning: true, startedAt: Date.now() };
    });
  }, [persistSession]);

  const handleEndWorkout = useCallback(() => {
    setActiveSession((prev) => {
      if (!prev) return prev;
      if (prev.loggedSets.length > 0) {
        const newEntries = prev.loggedSets.map((s) => ({ id: s.id, exercise: s.exercise, date: prev.dateKey, weight: s.weight, reps: String(s.reps), sets: "" }));
        setLiftLogs((prevLogs) => { const next = [...prevLogs, ...newEntries]; lsSet("lift-logs", next); return next; });
      }
      handleSetStatus(prev.dateKey, "done");
      lsSet("active-session", null);
      return null;
    });
    setSessionViewOpen(false);
  }, [handleSetStatus]);

  const handleMinimize = useCallback(() => setSessionViewOpen(false), []);

  if (sessionViewOpen && activeSession) {
    const dateObj = fromKey(activeSession.dateKey);
    const plan = getDayPlan(dateObj, startDate, statusMap);
    return h(WorkoutSessionView, {
      dateObj, plan, session: activeSession, liftLogs,
      onAddSet: handleAddSet, onRemoveSet: handleRemoveSet,
      onTogglePause: handleTogglePause, onEnd: handleEndWorkout, onMinimize: handleMinimize,
    });
  }

  const todayPlan = getDayPlan(startOfDay(new Date()), startDate, statusMap);

  let body;
  if (tab === "calendar") body = h(CalendarTab, { startDate, statusMap, onSetStatus: handleSetStatus, activeSession, onStartWorkout: handleStartWorkout });
  else if (tab === "week") body = h(ThisWeekTab, { startDate, statusMap, onSetStatus: handleSetStatus, activeSession, onStartWorkout: handleStartWorkout });
  else body = h(ProgressTab, { liftLogs, runLogs, bodyWeightLogs, onAddLift: handleAddLift, onAddRun: handleAddRun, onAddBodyWeight: handleAddBodyWeight });

  const navItems = [
    { key: "calendar", label: "Calendar", iconName: "calendar" },
    { key: "week", label: "This Week", iconName: "list" },
    { key: "progress", label: "Progress", iconName: "chart" },
  ].map((item) => h("button", { key: item.key, onClick: () => setTab(item.key), style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "12px 0", background: "none", border: "none", color: tab === item.key ? C.brass : C.textFaint } },
    h(Icon, { name: item.iconName, size: 18 }), h("span", { style: { fontSize: 10.5 } }, item.label)
  ));

  return h("div", { style: { background: C.bg, minHeight: "100vh", fontFamily: FONT_BODY, display: "flex", flexDirection: "column" } },
    h("div", { style: { padding: "20px 20px 16px", borderBottom: `1px solid ${C.hairline}` } },
      h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
        h("div", null,
          h("div", { style: { fontFamily: FONT_HEAD, color: C.text, fontSize: 22, letterSpacing: 0.5 } }, "SPLIT / RUN"),
          h("div", { style: { color: C.textMuted, fontSize: 12.5, marginTop: 2 } }, todayPlan.status === "before-start" ? `Program starts ${fmtShort(startDate)}` : `Week ${todayPlan.week} · ${todayPlan.weekLetter} — ${slotTitle(todayPlan.slot)}`)
        ),
        h("button", { onClick: () => setEditingStart((v) => !v), style: { background: "none", border: "none", padding: 8, color: C.textFaint } }, h(Icon, { name: "pencil", size: 15 }))
      ),
      editingStart ? h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginTop: 12 } },
        h("span", { style: { color: C.textMuted, fontSize: 12.5 } }, "Program start date"),
        h("input", { type: "date", value: toKey(startDate), onChange: (e) => persistStartDate(fromKey(e.target.value)), style: { background: C.surface, color: C.text, border: `1px solid ${C.hairline}`, borderRadius: 6, padding: "5px 8px", fontSize: 13 } })
      ) : null
    ),
    h("div", { style: { padding: "20px 20px", flex: 1 } }, body),
    activeSession ? h("button", { onClick: () => setSessionViewOpen(true), style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 20px", background: C.brass, color: "#1B1204", border: "none", fontSize: 13, fontWeight: 600 } },
      h("span", { style: { display: "flex", alignItems: "center", gap: 6 } }, h(Icon, { name: "clock", size: 14 }), `Workout in progress · ${formatElapsed(getElapsedMs(activeSession))}`),
      h("span", null, "Resume →")
    ) : null,
    h("div", { style: { display: "flex", borderTop: `1px solid ${C.hairline}`, background: C.surface, paddingBottom: "env(safe-area-inset-bottom)" } }, navItems)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(FitnessApp));
</script>
</body>
</html>
